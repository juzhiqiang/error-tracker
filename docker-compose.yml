services:
  postgres:
    image: postgres:16-alpine
    container_name: error-tracker-pg
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: error_tracker
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: error-tracker-minio
    command: server /data --console-address ":9012"
    environment:
      MINIO_ROOT_USER: tracker
      MINIO_ROOT_PASSWORD: tracker123
    ports:
      - "9011:9000"
      - "9012:9012"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: error-tracker-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
