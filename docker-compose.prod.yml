services:
  postgres:
    image: postgres:16-alpine
    container_name: error-tracker-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tracker} -d $${POSTGRES_DB:-error_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: error-tracker-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: error-tracker-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app-full:
    profiles: ["full"]
    image: error-tracker:full
    build:
      context: .
      dockerfile: Dockerfile
      target: full
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ERROR_TRACKER_DSN: ${NEXT_PUBLIC_ERROR_TRACKER_DSN:-}
        NEXT_PUBLIC_ERROR_TRACKER_TOKEN: ${NEXT_PUBLIC_ERROR_TRACKER_TOKEN:-}
        NEXT_PUBLIC_ERROR_TRACKER_SELF_MONITORING_ENABLED: ${NEXT_PUBLIC_ERROR_TRACKER_SELF_MONITORING_ENABLED:-false}
        NEXT_PUBLIC_ERROR_TRACKER_ENVIRONMENT: ${NEXT_PUBLIC_ERROR_TRACKER_ENVIRONMENT:-production}
        NEXT_PUBLIC_ERROR_TRACKER_RELEASE: ${NEXT_PUBLIC_ERROR_TRACKER_RELEASE:-}
    container_name: error-tracker-prod
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3002:3002"
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    profiles: ["api"]
    image: error-tracker:api
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ERROR_TRACKER_DSN: ${NEXT_PUBLIC_ERROR_TRACKER_DSN:-}
        NEXT_PUBLIC_ERROR_TRACKER_TOKEN: ${NEXT_PUBLIC_ERROR_TRACKER_TOKEN:-}
        NEXT_PUBLIC_ERROR_TRACKER_SELF_MONITORING_ENABLED: ${NEXT_PUBLIC_ERROR_TRACKER_SELF_MONITORING_ENABLED:-false}
        NEXT_PUBLIC_ERROR_TRACKER_ENVIRONMENT: ${NEXT_PUBLIC_ERROR_TRACKER_ENVIRONMENT:-production}
        NEXT_PUBLIC_ERROR_TRACKER_RELEASE: ${NEXT_PUBLIC_ERROR_TRACKER_RELEASE:-}
    container_name: error-tracker-api-prod
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
